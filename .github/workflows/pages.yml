name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # GitHub Pages must be enabled once under Settings > Pages (Source: GitHub Actions).
      # GITHUB_TOKEN cannot create the Pages site: it lacks repository administration permission.
      - name: Validate page structure and JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.DOTALL)
          assert len(scripts) == 1, 'Expected exactly one inline module'
          for element_id in ['canvas','view','controlsPanel','advancedControls','quickResult','ideal','dawn','noon','alt','sunView','resetView']:
              assert f'id="{element_id}"' in html, f'Missing element {element_id}'
          pathlib.Path('/tmp/orbit.mjs').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/orbit.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check certificate and enable HTTPS when available
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site_json="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null || true)"
          if [ -z "$site_json" ]; then
            echo "::notice::Cannot read GitHub Pages certificate status with this token."
            exit 0
          fi
          state="$(echo "$site_json" | jq -r '.https_certificate.state // "not-provisioned"')"
          enforce="$(echo "$site_json" | jq -r '.https_enforced // false')"
          echo "$site_json" | jq -c '{cname, html_url, https_enforced, protected_domain_state, certificate: {state: .https_certificate.state, description: .https_certificate.description, domains: .https_certificate.domains}}'
          echo "Certificate state: $state; HTTPS enforced: $enforce"
          if [ "$state" = "approved" ] && [ "$enforce" != "true" ]; then
            if echo '{"https_enforced":true}' | gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null; then
              echo "HTTPS enforcement enabled."
            else
              echo "::warning::HTTPS certificate approved but changing Pages site settings requires repository admin permissions."
            fi
          fi
